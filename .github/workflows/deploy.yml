name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build project
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Configure CNAME for deployment target
        run: |
          if [ -n "${{ steps.pages.outputs.base_path }}" ]; then
            echo "Deploying to GitHub Pages subpath (${{ steps.pages.outputs.base_path }})."
            echo "Removing CNAME from dist so github.io does not redirect."
            rm -f dist/CNAME
          else
            echo "Deploying to custom domain. Ensuring CNAME is present in dist."
            echo "www.kstourssrilanka.com" > dist/CNAME
          fi

      - name: Verify production build output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html was not generated by Vite build!"
            exit 1
          fi
          if grep -q "/src/main.tsx" dist/index.html; then
            echo "Error: dist/index.html contains /src/main.tsx! The production build must reference compiled bundles."
            exit 1
          fi
          echo "Build verification passed: dist/index.html references compiled production bundles."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
