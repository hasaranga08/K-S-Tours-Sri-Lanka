name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build project
        run: npm run build

      - name: Verify production build output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html was not generated by Vite build!"
            exit 1
          fi
          if grep -q "/src/main.tsx" dist/index.html; then
            echo "Error: dist/index.html contains /src/main.tsx! The production build must reference compiled bundles."
            exit 1
          fi
          echo "Build verification passed: dist/index.html references compiled production bundles."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
