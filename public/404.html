<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Kumar &amp; Sons Tours Sri Lanka</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // Keep 1 segment on *.github.io (repository subpath), 0 segments on custom root domains
      var isGitHubIo = window.location.hostname.indexOf('github.io') !== -1;
      var pathSegmentsToKeep = isGitHubIo ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
